name: Godot headless tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: godot-tests-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # reviewed v6 commit
        with:
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Download and verify official Godot 4.7.2
        run: |
          set -euo pipefail
          engine_dir="$RUNNER_TEMP/godot-4.7.2"
          mkdir -p "$engine_dir"
          archive="$engine_dir/godot.zip"
          curl --fail --location --silent --show-error --retry 3 \
            --proto '=https' --proto-redir '=https' \
            'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' \
            --output "$archive"
          printf '%s  %s\n' 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4' "$archive" | sha256sum --check --strict
          unzip -q "$archive" -d "$engine_dir"
          chmod +x "$engine_dir/Godot_v4.7.2-stable_linux.x86_64"
          printf 'GODOT=%s\n' "$engine_dir/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Verify version
        run: |
          set -euo pipefail
          version="$("$GODOT" --version)"
          printf '%s\n' "$version"
          [[ "$version" =~ ^4\.7\.2\.stable\.official\.[[:xdigit:]]+$ ]]

      - name: Import and test
        run: |
          set -euo pipefail
          # Logs remain temporary; stdout/stderr are visible in the Actions job.
          # Match engine diagnostic prefixes, not arbitrary mentions of "error".
          check_log() {
            if grep -Eq '^[[:space:]]*(SCRIPT ERROR:|ERROR:)' "$1"; then
              echo 'Godot emitted an error diagnostic.' >&2
              return 1
            fi
          }
          export NO_COLOR=1
          "$GODOT" --headless --path . --import 2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          check_log "$RUNNER_TEMP/godot-import.log"
          "$GODOT" --headless --path . --script res://tests/personaje_camara.gd 2>&1 | tee "$RUNNER_TEMP/godot-tests.log"
          check_log "$RUNNER_TEMP/godot-tests.log"
          grep -Fxq 'personaje_camara: 0 failures' "$RUNNER_TEMP/godot-tests.log"
          "$GODOT" --headless --path . --script res://tests/faro_interaccion.gd 2>&1 | tee "$RUNNER_TEMP/godot-faro-es.log"
          check_log "$RUNNER_TEMP/godot-faro-es.log"
          grep -Fxq 'faro_interaccion: 0 failures' "$RUNNER_TEMP/godot-faro-es.log"
          "$GODOT" --headless --path . --script res://tests/faro_interaccion.gd -- --game-language en --expect-locale=en 2>&1 | tee "$RUNNER_TEMP/godot-faro-en.log"
          check_log "$RUNNER_TEMP/godot-faro-en.log"
          grep -Fxq 'faro_interaccion: 0 failures' "$RUNNER_TEMP/godot-faro-en.log"
          "$GODOT" --headless --path . --script res://tests/puente_reconstruccion.gd 2>&1 | tee "$RUNNER_TEMP/godot-puente.log"
          check_log "$RUNNER_TEMP/godot-puente.log"
          grep -Fxq 'puente_reconstruccion: 0 failures' "$RUNNER_TEMP/godot-puente.log"
